<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latissa AI — digitalni pomočnik</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #f6ece4; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .page {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 100vh;
      padding: 20px;
    }
    .logo-area {
      text-align: center; margin-bottom: 24px;
    }
    .logo-area h1 {
      font-size: 22px; font-weight: 700; color: #3a322e; letter-spacing: 0.02em;
    }
    .logo-area p {
      font-size: 14px; color: #8a7a70; margin-top: 6px;
    }
    .hint {
      font-size: 13px; color: #b9a89c; text-align: center; margin-top: 16px;
    }
    .hint a { color: #3a322e; text-decoration: none; font-weight: 600; }
    .hint a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="page">
    <div class="logo-area">
      <h1>Latissa home&amp;decor</h1>
      <p>Digitalni pomočnik</p>
    </div>
    <div class="hint">
      Kliknite na gumb v spodnjem desnem kotu za pogovor.<br>
      Obiščite <a href="https://latissa.si" target="_blank">latissa.si</a> za celotno ponudbo.
    </div>
  </div>
  <script src="/static/widget.js?v=4" defer></script>
</body>
</html>
